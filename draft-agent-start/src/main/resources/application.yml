server:
  port: 8080
  servlet:
    context-path: /draft-agent

spring:
  application:
    name: draft-agent
  profiles:
    # 默认 profile（未显式设置 SPRING_PROFILES_ACTIVE 时使用 dev）；生产需通过 SPRING_PROFILES_ACTIVE 覆盖
    default: dev
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
    chat:
      memory:
        repository:
          jdbc:
            # 不自动执行建表脚本；SPRING_AI_CHAT_MEMORY 需在目标库手动执行 docs/sql/spring_ai_chat_memory.sql
            initialize-schema: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # 从环境变量读取；留空时仅开发使用进程内随机密钥（重启后旧 token 失效）
  secret: ${JWT_SECRET:}

logging:
  level:
    com.draftagent: info
