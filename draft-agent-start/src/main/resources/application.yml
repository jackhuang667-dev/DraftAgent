server:
  port: 8080
  servlet:
    context-path: /draft-agent

spring:
  application:
    name: draft-agent
  profiles:
    # 默认 profile（未显式设置 SPRING_PROFILES_ACTIVE 时使用 dev）；生产需通过 SPRING_PROFILES_ACTIVE 覆盖
    default: dev
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 25MB
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
    chat:
      memory:
        repository:
          jdbc:
            # 不自动执行建表脚本；SPRING_AI_CHAT_MEMORY 需在目标库手动执行 docs/sql/spring_ai_chat_memory.sql
            initialize-schema: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # 从环境变量读取；留空时仅开发使用进程内随机密钥（重启后旧 token 失效）
  secret: ${JWT_SECRET:}

rag:
  storage:
    # 本地文件存储根目录（纳入 .gitignore，不提交运行数据）
    root: ${DOC_STORAGE_ROOT:./data/documents}
  document:
    # V1 单文件最大 20MB（与 spring.servlet.multipart.max-file-size 保持一致）
    max-file-size-bytes: ${DOC_MAX_FILE_SIZE_BYTES:20971520}
    chunk-size: 800
    min-chunk-size-chars: 350
    min-chunk-length-to-embed: 5
    max-num-chunks: 10000
  embedding:
    # 独立于 DeepSeek Chat；API Key 仅来自环境变量，禁止写入仓库
    base-url: ${EMBEDDING_BASE_URL:https://api.siliconflow.cn}
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL:BAAI/bge-m3}
    dimensions: ${EMBEDDING_DIMENSIONS:1024}
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
  qdrant:
    # 独立于 Embedding 与 DeepSeek Chat；默认不在启动时连接/初始化
    host: ${QDRANT_HOST:localhost}
    grpc-port: ${QDRANT_GRPC_PORT:6334}
    collection: ${QDRANT_COLLECTION:draftagent_chunks_v1}
    dimensions: ${QDRANT_DIMENSIONS:1024}
    distance: ${QDRANT_DISTANCE:Cosine}
    timeout-ms: ${QDRANT_TIMEOUT_MS:10000}
    initialize-on-startup: ${QDRANT_INIT_ON_STARTUP:false}
  retrieval:
    # 向量检索 Top-K：默认 5，硬上限 20；非法值在服务层拒绝，不设置相似度阈值
    top-k: ${RAG_RETRIEVAL_TOP_K:5}
    max-top-k: ${RAG_RETRIEVAL_MAX_TOP_K:20}
    # RAG 参考资料字符预算（仅统计格式化后的 Chunk 引用块及分隔符）
    max-context-chars: ${RAG_RETRIEVAL_MAX_CONTEXT_CHARS:12000}

logging:
  level:
    com.draftagent: info
